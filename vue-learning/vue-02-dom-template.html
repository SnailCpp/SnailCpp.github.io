<style>
  [v-cloak] {
    display: none;
  }
</style>

<div id="app" v-cloak>
  <button @click="count++">{{ count }}</button>
</div>

<script type="module">
  import { createApp, ref } from "https://unpkg.com/vue@3/dist/vue.esm-browser.js";

  createApp({
    setup() {
      const count = ref(0);
      return { count };
    },
  }).mount("#app");
</script>
